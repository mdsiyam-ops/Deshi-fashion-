<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BD Mart Storefront and Dashboard</title>
    <meta name="description" content="An elegant, modern storefront and administration panel for BD Mart, featuring interactive catalog browsing, size/color selectors, a bottom-sheet checkout, real-time analytics, inventory editing, and order lifecycle management." />
    <meta property="og:title" content="BD Mart Storefront and Dashboard" />
    <meta property="og:description" content="An elegant, modern storefront and administration panel for BD Mart, featuring interactive catalog browsing, size/color selectors, a bottom-sheet checkout, real-time analytics, inventory editing, and order lifecycle management." />
    <meta name="theme-color" content="#ea580c" />
    <style>
      /* Pre-loader styling prevents white flash before bundle executes */
      .app-initial-loader {
        position: fixed;
        inset: 0;
        background-color: #faf8f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #1e1b4b;
        z-index: 9999;
      }
      .app-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #fed7aa;
        border-top-color: #ea580c;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-initial-loader">
        <div class="app-spinner"></div>
        <div style="margin-top: 18px; text-align: center;">
          <h2 style="margin: 0; font-size: 16px; font-weight: 800; color: #010211; letter-spacing: 0.05em; text-transform: uppercase;">
            বিডি মার্ট (BD MART)
          </h2>
          <p style="margin: 6px 0 0 0; font-size: 12px; color: #78716c; font-weight: 500;">
            ওয়েবসাইট লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
